openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Textile ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: purchaseGatePasses
  - name: purchaseBills
  - name: paymentPaids
  - name: saleGatePasses
  - name: salesBills
  - name: paymentReceives
  - name: returnGatePasses
  - name: returnBills
  - name: reports
  - name: stockReports
  - name: purchaseParties
  - name: saleParties
  - name: shikanja
  - name: categories

      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SaleParty"
        total:
          type: integer

    Shikanja:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: integer

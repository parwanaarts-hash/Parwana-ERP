components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    docNumber:
      name: docNumber
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
    offset:
      name: offset
      in: query
      schema:
        type: integer
    fromDate:
      name: fromDate
      in: query
      schema:
        type: string
    toDate:
      name: toDate
      in: query
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Master Data ─────────────────────────────────────────────────────────────
    PurchaseParty:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        nameUrdu:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        mobile:
          type: ["string", "null"]
        openingCredit:
          type: ["string", "null"]
        openingDebit:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        shikanjaId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PurchasePartyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nameUrdu:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
        mobile:
          type: string
        openingCredit:
          type: number
        openingDebit:
          type: number
        type:
          type: string
          enum: [cash, credit]
        shikanjaId:
          type: integer

    PurchasePartyList:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseParty"
        total:
          type: integer

    SaleParty:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        nameUrdu:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        mobile:
          type: ["string", "null"]
        creditLimit:
          type: ["string", "null"]
        openingCredit:
          type: ["string", "null"]
        openingDebit:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        shikanjaId:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    SalePartyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nameUrdu:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
        mobile:
          type: string
        creditLimit:
          type: number
        openingCredit:
          type: number
        openingDebit:
          type: number
        type:
          type: string
          enum: [cash, credit]
        shikanjaId:
          type: integer

